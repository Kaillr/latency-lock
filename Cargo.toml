[package]
name = "latency-lock"
version = "0.1.0"
edition = "2024"
description = "Tray app that keeps the Windows audio engine at the smallest buffer your driver supports, and re-applies it automatically after device changes."
repository = "https://github.com/Kaillr/latency-lock"
readme = "README.md"
keywords = ["audio", "latency", "wasapi", "windows", "tray"]
categories = ["multimedia::audio"]

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
